services:
  backend:
    build:
      context: ..
      dockerfile: platform/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      RESEARCH_WORKERS: 2
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
